<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Keki Bora Bakery</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Navigation Bar -->
    <nav>
        <div class="logo">Keki Bora Bakery</div>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="menu.html">Menu</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="order.html" class="order-btn" target="_blank">Order Online</a></li>
        </ul>
    </nav>

    <!-- Contact Section -->
    <section class="contact">
        <h2>Contact Us</h2>

        <div class="contact-info">
            <p><strong>Address:</strong> KSTVET Hotel, Main Street, Nairobi</p>
            <p><strong>Phone:</strong> +254 708 441 246</p>
            <p><strong>Email:</strong> info@kekibora.com</p>
        </div>

        <!-- Google Map -->
        <div class="map">
            <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d11447.259691717049!2d36.814809471954675!3d-1.2414601922525297!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e1!3m2!1sen!2ske!4v1739471161473!5m2!1sen!2ske" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>

        <!-- Contact Form -->
        <form id="contact-form">
            <label for="name">Your Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Your Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="message">Your Message:</label>
            <textarea id="message" name="message" rows="4" required></textarea>

            <button type="submit">Send Message</button>
        </form>

        <p id="form-status"></p>
    </section>

    <script src="script.js"></script>

    <footer>
        <p>&copy; 2025 Keki Bora Bakery. All rights reserved.</p>
    </footer>
</body>
</html>
